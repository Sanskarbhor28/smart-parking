# Runs PostgreSQL + API + dashboard.  Usage:  copy .env.example to .env, set POSTGRES_PASSWORD, then
#   docker compose up --build
# API: http://localhost:8000/docs   Dashboard: http://localhost:8501
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parking_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smart_parking}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parking_user} -d ${POSTGRES_DB:-smart_parking}"]
      interval: 5s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-parking_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smart_parking}
      TOTAL_SLOTS: ${TOTAL_SLOTS:-30}
    volumes: ["./ml/models:/app/ml/models", "./data:/app/data"]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    # train the model if missing, load demo (synthetic) history if the DB is empty, start the API
    command: >
      sh -c "[ -f ml/models/parking_models.joblib ] || python -m ml.train;
             python -m database.seed_database;
             uvicorn backend.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: .
    environment:
      API_URL: http://backend:8000
    ports: ["8501:8501"]
    depends_on: [backend]
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501

volumes:
  pgdata:
